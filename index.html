<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1">

<title>Marketing Workspace</title>

<link
rel="stylesheet"
href="assets/css/app.css">

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">

        <h1>space</p>

    </div>

    <div class="menu">

        <div class="menu-item active">
            Chamados
        </div>

        <div class="menu-item">
            Indicadores
        </div>

        <div class="menu-item">
            Configurações
        </div>

    </div>

</div>

<!-- CONTEÚDO -->

<div class="content">

    <div class="page-title">

        <h2>Chamados</h2>

        <p>
            Visualize e acompanhe todas as demandas do Marketing.
        </p>

    </div>

    <!-- FILTROS -->

    <div class="filters">

        <input
        type="text"
        placeholder="Pesquisar demanda...">

        <select>
            <option>Responsável</option>
        </select>

        <select>
            <option>Prioridade</option>
        </select>

        <select>
            <option>Categoria</option>
        </select>

        <select>
            <option>Prazo</option>
        </select>

        <div class="view-selector">

            <select>

                <option>Kanban</option>

                <option>Lista</option>

                <option>Calendário</option>

                <option>Gantt</option>

            </select>

        </div>

    </div>

    <!-- KANBAN -->

    <div class="card">

        <h3>Kanban</h3>

        <br>

        <div class="kanban-board">

            <div class="kanban-column">

                <div class="column-header">

                    <strong>Novo</strong>

                    <span class="column-count">
                        XXXX
                    </span>

                </div>

                <div class="placeholder">

                    <!-- COLE CARD AQUI -->

                </div>

            </div>

            <div class="kanban-column">

                <div class="column-header">

                    <strong>Atendimento</strong>

                    <span class="column-count">
                        XXXX
                    </span>

                </div>

                <div class="placeholder">

                    <!-- COLE CARD AQUI -->

                </div>

            </div>

            <div class="kanban-column">

                <div class="column-header">

                    <strong>Planejamento</strong>

                    <span class="column-count">
                        XXXX
                    </span>

                </div>

                <div class="placeholder">

                    <!-- COLE CARD AQUI -->

                </div>

            </div>

            <div class="kanban-column">

                <div class="column-header">

                    <strong>Criação</strong>

                    <span class="column-count">
                        XXXX
                    </span>

                </div>

                <div class="placeholder">

                    <!-- COLE CARD AQUI -->

                </div>

            </div>

            <div class="kanban-column">

                <div class="column-header">

                    <strong>Pendente</strong>

                    <span class="column-count">
                        XXXX
                    </span>

                </div>

                <div class="placeholder">

                    <!-- COLE CARD AQUI -->

                </div>

            </div>

            <div class="kanban-column">

                <div class="column-header">

                    <strong>Aprovação</strong>

                    <span class="column-count">
                        XXXX
                    </span>

                </div>

                <div class="placeholder">

                    <!-- COLE CARD AQUI -->

                </div>

            </div>

            <div class="kanban-column">

                <div class="column-header">

                    <strong>Disparo</strong>

                    <span class="column-count">
                        XXXX
                    </span>

                </div>

                <div class="placeholder">

                    <!-- COLE CARD AQUI -->

                </div>

            </div>

            <div class="kanban-column">

                <div class="column-header">

                    <strong>Concluído</strong>

                    <span class="column-count">
                        XXXX
                    </span>

                </div>

                <div class="placeholder">

                    <!-- COLE CARD AQUI -->

                </div>

            </div>

        </div>

    </div>

</div>

</html>

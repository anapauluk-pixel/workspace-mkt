<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Marketing Workspace</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,Segoe UI,sans-serif;
}

body{
display:flex;
height:100vh;
background:#F7F9FC;
}

.sidebar{
width:260px;
background:#00995D;
color:white;
padding:24px;
}

.logo{
margin-bottom:40px;
}

.logo h1{
font-size:28px;
}

.logo p{
font-size:13px;
opacity:.9;
}

.menu{
display:flex;
flex-direction:column;
gap:10px;
}

.menu-item{
padding:14px;
border-radius:12px;
cursor:pointer;
}

.menu-item.active{
background:rgba(255,255,255,.18);
}

.content{
flex:1;
padding:32px;
overflow:auto;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.header h2{
font-size:34px;
}

.kpis{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:24px;
}

.kpi{
background:white;
padding:24px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,.05);
}

.kpi-number{
font-size:42px;
font-weight:700;
}

.kpi-label{
color:#64748B;
margin-top:6px;
}

.card{
background:white;
padding:24px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,.05);
margin-bottom:20px;
}

</style>

</head>
<body>

<div class="sidebar">

<div class="logo">
<h1>Marketing</h1>
<p>Workspace</p>
</div>

<div class="menu">

<div class="menu-item active">
Chamados
</div>

<div class="menu-item">
Indicadores
</div>

<div class="menu-item">
Configurações
</div>

</div>

</div>

<div class="content">

<div class="header">

<div>

<h2>Bom dia, Ana</h2>

<p>
312 demandas ativas •
21 pendentes •
17 aprovações •
8 atrasadas
</p>

</div>

</div>

<div class="kpis">

<div class="kpi">
<div class="kpi-number">312</div>
<div class="kpi-label">Demandas</div>
</div>

<div class="kpi">
<div class="kpi-number">58</div>
<div class="kpi-label">Andamento</div>
</div>

<div class="kpi">
<div class="kpi-number">21</div>
<div class="kpi-label">Pendentes</div>
</div>

<div class="kpi">
<div class="kpi-number">17</div>
<div class="kpi-label">Aprovação</div>
</div>

<div class="kpi">
<div class="kpi-number">9</div>
<div class="kpi-label">Atrasadas</div>
</div>

<div class="kpi">
<div class="kpi-number">228</div>
<div class="kpi-label">Concluídas</div>
</div>

</div>

<div class="card">

<div style="
display:flex;
justify-content:space-between;
gap:12px;
flex-wrap:wrap;
">

<input
placeholder="Pesquisar demanda..."
style="
height:46px;
padding:0 14px;
border:1px solid #E2E8F0;
border-radius:12px;
min-width:250px;
">

<select style="
height:46px;
padding:0 14px;
border-radius:12px;
border:1px solid #E2E8F0;
">
<option>Responsável</option>
</select>

<select style="
height:46px;
padding:0 14px;
border-radius:12px;
border:1px solid #E2E8F0;
">
<option>Prioridade</option>
</select>

<select style="
height:46px;
padding:0 14px;
border-radius:12px;
border:1px solid #E2E8F0;
">
<option>Categoria</option>
</select>

<select style="
height:46px;
padding:0 14px;
border-radius:12px;
border:1px solid #E2E8F0;
">
<option>Prazo</option>
</select>

<select style="
height:46px;
padding:0 14px;
border-radius:12px;
border:1px solid #E2E8F0;
">
<option>Kanban</option>
<option>Lista</option>
<option>Calendário</option>
<option>Gantt</option>
</select>

</div>

</div>

<div style="
background:white;
padding:14px;
border-radius:14px;
box-shadow:0 4px 10px rgba(0,0,0,.05);
">

    <!-- ID -->

    <div style="
    font-size:12px;
    color:#94A3B8;
    margin-bottom:10px;
    ">
        #1024
    </div>

    <!-- TÍTULO -->

    <div style="
    font-weight:600;
    font-size:15px;
    margin-bottom:10px;
    ">
        Campanha Setembro
    </div>

    <!-- ÁREA -->

    <div style="
    font-size:13px;
    color:#64748B;
    margin-bottom:4px;
    ">
        Comercial
    </div>

    <!-- RESPONSÁVEL -->

    <div style="
    font-size:13px;
    color:#64748B;
    margin-bottom:12px;
    ">
        Ana Luiza
    </div>

    <!-- TAGS -->

    <div style="
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:12px;
    ">

        <span style="
        background:#FEE2E2;
        color:#DC2626;
        padding:4px 8px;
        border-radius:999px;
        font-size:12px;
        font-weight:600;
        ">
            Alta
        </span>

        <span style="
        background:#FEF3C7;
        color:#D97706;
        padding:4px 8px;
        border-radius:999px;
        font-size:12px;
        font-weight:600;
        ">
            Atenção
        </span>

    </div>

    <!-- PRAZO -->

    <div style="
    font-size:13px;
    margin-bottom:12px;
    ">
        <strong>Prazo:</strong> 20/09
    </div>

    <!-- PROGRESSO -->

    <div style="
    height:8px;
    background:#E2E8F0;
    border-radius:999px;
    overflow:hidden;
    ">

        <div style="
        height:100%;
        width:65%;
        background:#00995D;
        ">
        </div>

    </div>

    <div style="
    margin-top:8px;
    font-size:13px;
    font-weight:600;
    ">
        65%
    </div>

    <!-- INDICADORES -->

    <div style="
    display:flex;
    gap:16px;
    align-items:center;
    color:#64748B;
    margin-top:14px;
    ">

        <!-- SUBTAREFAS -->

        <div style="
        display:flex;
        align-items:center;
        gap:6px;
        ">

            <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#64748B"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">

                <path d="M9 11L12 14L22 4"></path>

                <path d="M21 12V19A2 2 0 0 1 19 21H5A2 2 0 0 1 3 19V5A2 2 0 0 1 5 3H16"></path>

            </svg>

            <span style="
            font-size:13px;
            ">
                4/8
            </span>

        </div>

        <!-- ANEXOS -->

        <div>

            <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#64748B"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round">

                <path d="M21.44 11.05L12.25 20.24A5 5 0 0 1 5.18 13.17L14.37 4A3 3 0 0 1 18.62 8.24L9.42 17.44A1 1 0 0 1 8 16.03L16.49 7.54"></path>

            </svg>

        </div>

    </div>

</div>



</body>
</html>

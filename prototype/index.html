<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Workspace MKT</title>

    <link rel="stylesheet" href="./assets/css/theme.css">
<link rel="stylesheet" href="./assets/css/app.css">
<link rel="stylesheet" href="./assets/css/layout.css">
<link rel="stylesheet" href="./assets/css/components.css">
<link rel="stylesheet" href="./assets/css/views.css">

</head>

<body>

    <div id="app">

        <aside id="sidebar">

            <div class="sidebar-header">

                <div class="logo">
                    Workspace MKT
                </div>

            </div>

            <nav class="sidebar-navigation">

                <ul>

                    <li>
                        <button
                            type="button"
                            class="menu-item active"
                            data-route="dashboard"
                        >
                            Dashboard
                        </button>
                    </li>

                    <li>
                        <button
                            type="button"
                            class="menu-item"
                            data-route="demandas"
                        >
                            Demandas
                        </button>
                    </li>

                    <li>
                        <button
                            type="button"
                            class="menu-item"
                            data-route="aprovacoes"
                        >
                            Aprovações
                        </button>
                    </li>

                    <li>
                        <button
                            type="button"
                            class="menu-item"
                            data-route="equipe"
                        >
                            Equipe
                        </button>
                    </li>

                    <li>
                        <button
                            type="button"
                            class="menu-item"
                            data-route="relatorios"
                        >
                            Relatórios
                        </button>
                    </li>

                    <li>
                        <button
                            type="button"
                            class="menu-item"
                            data-route="configuracoes"
                        >
                            Configurações
                        </button>
                    </li>

                </ul>

            </nav>

        </aside>

        <div id="main-layout">

            <header id="header">

                <div class="header-left">

                    <button
                        type="button"
                        id="sidebar-toggle"
                    >
                        ☰
                    </button>

                    <div id="breadcrumb">

                        Workspace MKT

                        <span class="breadcrumb-separator">
                            >
                        </span>

                        Dashboard

                    </div>

                </div>

                <div class="header-center">

                    <input
                        type="text"
                        id="global-search"
                        placeholder="Pesquisar..."
                    >

                </div>

                <div class="header-right">

                    <button
                        type="button"
                        id="header-filter-button"
                    >
                        Filtros
                    </button>

                    <button
                        type="button"
                        id="header-action-button"
                    >
                        Nova Demanda
                    </button>

                    <button
                        type="button"
                        id="user-button"
                    >
                        Ana Luiza
                    </button>

                </div>

            </header>

            <main id="main-content">

                <section class="view-placeholder">

                    <h1>
                        Dashboard
                    </h1>

                    <p>
                        Workspace MKT iniciado com sucesso.
                    </p>

                </section>

            </main>

        </div>

        <div id="drawer-container"></div>

        <div id="modal-container"></div>

        <div id="toast-container"></div>

    </div>

<link rel="stylesheet" href="./assets/css/theme.css">
<link rel="stylesheet" href="./assets/css/app.css">
<link rel="stylesheet" href="./assets/css/layout.css">
<link rel="stylesheet" href="./assets/css/components.css">
<link rel="stylesheet" href="./assets/css/views.css">

</body>

</html>
